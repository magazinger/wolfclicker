<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Wolf Clicker</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #0e1a22;
    --panel: #16262f;
    --moon: #e8eef2;
    --ice: #7fc4e0;
    --ember: #f2a33a;
    --muted: #7d909b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--moon); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; touch-action: manipulation; }
  .app { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: max(20px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom)); }
  .score { text-align: center; }
  .score small { color: var(--muted); font-size: 14px; }
  .score .num { font-size: 52px; font-weight: 800; letter-spacing: 1px; color: var(--ember); }
  .stage { position: relative; flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; }
  #tap {
    width: min(70vw, 300px); aspect-ratio: 1; border-radius: 50%; border: 6px solid var(--ice);
    background: radial-gradient(circle at 35% 30%, #27414f, #12222b 70%);
    box-shadow: 0 0 40px rgba(127,196,224,.25), inset 0 0 30px rgba(0,0,0,.5);
    display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer;
    transition: transform .08s ease, box-shadow .08s ease;
  }
  #tap:active, #tap.press { transform: scale(.95); box-shadow: 0 0 60px rgba(127,196,224,.45), inset 0 0 30px rgba(0,0,0,.5); }
  #tap.empty { filter: grayscale(.8) brightness(.7); }
  #tap { overflow: hidden; }
  #tap img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; pointer-events: none; }
  #tap .fallback { font-size: min(34vw, 150px); line-height: 1; pointer-events: none; }
  .float { position: absolute; font-weight: 800; font-size: 28px; color: var(--ember); pointer-events: none; animation: up .8s ease-out forwards; }
  @keyframes up { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-90px); } }
  .energy { width: 100%; max-width: 420px; }
  .energy .row { display: flex; justify-content: space-between; font-size: 15px; margin-bottom: 8px; }
  .bar { height: 14px; background: var(--panel); border-radius: 7px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--ice), #b6e3f4); transition: width .15s linear; }
  @media (prefers-reduced-motion: reduce) { .float { animation-duration: .01s; } #tap { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <div class="score"><small>Монеты</small><div class="num" id="coins">0</div></div>

  <div class="stage" id="stage">
    <button id="tap" aria-label="Тап">
      <!-- Положи свою картинку рядом: wolf.png. Если файла нет — покажется эмодзи -->
      <img id="emblem" src="wolf.png" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'fallback',textContent:'🐺'}))">
    </button>
  </div>

  <div class="energy">
    <div class="row"><span>Энергия</span><span id="etext">500 / 500</span></div>
    <div class="bar"><i id="ebar"></i></div>
  </div>
</div>

<script>
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor && tg.setHeaderColor('#0e1a22'); tg.setBackgroundColor && tg.setBackgroundColor('#0e1a22'); }

  // Настройки игры
  const MAX_ENERGY = 500;   // лимит энергии
  const TAP_COST = 1;       // сколько энергии тратит клик
  const TAP_GAIN = 1;       // сколько монет за клик
  const REGEN_PER_SEC = 1;  // восстановление энергии в секунду
  const KEY = 'wolf_clicker_v1';

  let state = { coins: 0, energy: MAX_ENERGY, ts: Date.now() };
  try { Object.assign(state, JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) {}

  // Энергия восстанавливается и пока приложение закрыто
  function regen() {
    const now = Date.now();
    const gained = ((now - state.ts) / 1000) * REGEN_PER_SEC;
    state.energy = Math.min(MAX_ENERGY, state.energy + gained);
    state.ts = now;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  const $ = id => document.getElementById(id);
  function render() {
    const e = Math.floor(state.energy);
    $('coins').textContent = Math.floor(state.coins).toLocaleString('ru-RU');
    $('etext').textContent = e + ' / ' + MAX_ENERGY;
    $('ebar').style.width = (state.energy / MAX_ENERGY * 100) + '%';
    $('tap').classList.toggle('empty', state.energy < TAP_COST);
  }

  function tap(x, y) {
    regen();
    if (state.energy < TAP_COST) { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('error'); render(); return; }
    state.energy -= TAP_COST;
    state.coins += TAP_GAIN;
    tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred('light');
    const f = document.createElement('div');
    f.className = 'float'; f.textContent = '+' + TAP_GAIN;
    const r = $('stage').getBoundingClientRect();
    f.style.left = (x - r.left - 10) + 'px'; f.style.top = (y - r.top - 20) + 'px';
    $('stage').appendChild(f);
    setTimeout(() => f.remove(), 800);
    render(); save();
  }

  // pointerdown + мультитач: каждый палец считается отдельным кликом
  $('tap').addEventListener('touchstart', ev => {
    ev.preventDefault();
    for (const t of ev.changedTouches) tap(t.clientX, t.clientY);
  }, { passive: false });
  $('tap').addEventListener('mousedown', ev => tap(ev.clientX, ev.clientY));

  setInterval(() => { regen(); render(); save(); }, 1000);
  regen(); render();
</script>
</body>
</html>
