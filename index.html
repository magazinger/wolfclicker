            background-position: center;
            border-radius: 50%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: transform 0.05s ease;
            position: relative;
            touch-action: manipulation;
        }

        .coin:active {
            transform: scale(0.92);
        }

        /* Энергия */
        .energy-container {
            width: 80%;
            max-width: 300px;
            margin-top: 40px;
            text-align: center;
        }

        .energy-text {
            font-size: 1.2rem;
            margin-bottom: 8px;
            color: #aaa;
        }

        .energy-bar-bg {
            width: 100%;
            height: 12px;
            background-color: #2a2a3a;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #444;
        }

        .energy-bar-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ffffff, #666666);
            border-radius: 6px;
            transition: width 0.1s ease;
        }

        .click-floating {
            position: absolute;
            color: #ffffff;
            font-size: 2.5rem;
            font-weight: bold;
            animation: floatUp 0.5s ease-out forwards;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-80px) scale(1.1); }
        }
    </style>
</head>
<body>

    <div class="score-container">
        🪙 <span id="score">0</span>
    </div>

    <!-- Монетка со львом -->
    <div class="coin" id="coinBtn"></div>

    <div class="energy-container">
        <div class="energy-text">⚡ <span id="energyText">500</span>/500</div>
        <div class="energy-bar-bg">
            <div class="energy-bar-fill" id="energyFill"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const scoreEl = document.getElementById('score');
        const coinBtn = document.getElementById('coinBtn');
        const energyTextEl = document.getElementById('energyText');
        const energyFillEl = document.getElementById('energyFill');

        const userId = tg.initDataUnsafe?.user?.id || 0;
        
        let score = parseInt(localStorage.getItem('wolf_score')) || 0;
        let energy = parseInt(localStorage.getItem('wolf_energy')) || 500;
        const maxEnergy = 500;

        scoreEl.textContent = score;
        updateEnergyUI();

        const BACKEND_URL = 'http://127.0.0.1:8000';

        function updateEnergyUI() {
            energyTextEl.textContent = energy;
            const percentage = (energy / maxEnergy) * 100;
            energyFillEl.style.width = `${percentage}%`;
            localStorage.setItem('wolf_energy', energy);
        }

        // Восстановление энергии (+3 в секунду)
        setInterval(() => {
            if (energy < maxEnergy) {
                energy = Math.min(maxEnergy, energy + 3);
                updateEnergyUI();
            }
        }, 1000);

        async function sendClick() {
            try {
                const response = await fetch(`${BACKEND_URL}/click`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId })
                });
                const data = await response.json();
                score = data.balance;
                scoreEl.textContent = score;
                localStorage.setItem('wolf_score', score);
            } catch (err) {
                // Если сервер выключен, кликаем автономно на телефоне
                score++;
                scoreEl.textContent = score;
                localStorage.setItem('wolf_score', score);
            }
        }

        // Мультитач для телефонов
        coinBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touches = e.changedTouches;
            
            for (let i = 0; i < touches.length; i++) {
                if (energy >= 1) {
                    energy--;
                    updateEnergyUI();
                    sendClick();

                    const clickText = document.createElement('div');
                    clickText.classList.add('click-floating');
                    clickText.textContent = '+1';
                    
                    const rect = coinBtn.getBoundingClientRect();
                    clickText.style.left = `${touches[i].clientX - rect.left}px`;
                    clickText.style.top = `${touches[i].clientY - rect.top}px`;
                    
                    coinBtn.appendChild(clickText);

                    setTimeout(() => { clickText.remove(); }, 500);
                }
            }
        });

        // Клик мышкой для компов
        coinBtn.addEventListener('click', (e) => {
            if (e.pointerType !== 'touch' && energy >= 1) {
                energy--;
                updateEnergyUI();
                sendClick();
            }
        });
    </script>
</body>
